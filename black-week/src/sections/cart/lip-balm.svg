  <rect x="43" y="22" width="34" height="42" rx="5" fill="url(#lbCap)"/>
  <rect x="43" y="58" width="34" height="3" fill="#cfd4cc" opacity=".7"/>
  <rect x="47" y="25" width="3" height="32" rx="1.5" fill="#fff" opacity=".9"/>
