  <rect x="44" y="80" width="32" height="50" fill="url(#lbLabel)"/>
  <path d="M44 122 L76 104 L76 108 L44 126 Z" fill="#f9b5c4" opacity=".9"/>
  <!-- bindrune mark (simplified) -->
  <circle cx="60" cy="92" r="6.2" stroke="#fff" stroke-width="1.3"/>
  <path d="M58.6 86.2v11.6M61.4 86.2v11.6M58.6 92.6l-3.4-3.6M61.4 90.4l3.4-3.2M61.4 94l3.6-3.4" stroke="#fff" stroke-width="1.1" stroke-linecap="round"/>
  <rect x="50" y="103" width="20" height="1.6" rx=".8" fill="#fff" opacity=".85"/>
  <rect x="53" y="107" width="14" height="1.2" rx=".6" fill="#fff" opacity=".6"/>
