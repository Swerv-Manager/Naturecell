<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" fill="none">
  <!-- Illustrative stand-in for CBD Lip Balm (no packshot in assets yet): white stick with sage label -->
  <defs>
    <linearGradient id="lbBody" x1="0" x2="1">
      <stop offset="0" stop-color="#e9ebe6"/><stop offset=".22" stop-color="#ffffff"/><stop offset=".62" stop-color="#f7f7f3"/><stop offset="1" stop-color="#d9ddd6"/>
    </linearGradient>
    <linearGradient id="lbLabel" x1="0" x2="1">
      <stop offset="0" stop-color="#6f9086"/><stop offset=".25" stop-color="#89a89f"/><stop offset=".65" stop-color="#80a097"/><stop offset="1" stop-color="#5f8077"/>
    </linearGradient>
    <linearGradient id="lbCap" x1="0" x2="1">
      <stop offset="0" stop-color="#e3e6e0"/><stop offset=".25" stop-color="#fdfdfb"/><stop offset=".7" stop-color="#f3f3ee"/><stop offset="1" stop-color="#d4d8d1"/>
    </linearGradient>
    <radialGradient id="lbShadow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#28403b" stop-opacity=".28"/><stop offset="1" stop-color="#28403b" stop-opacity="0"/></radialGradient>
  </defs>
  <ellipse cx="60" cy="146" rx="26" ry="5" fill="url(#lbShadow)"/>
  <!-- body -->
  <rect x="44" y="62" width="32" height="83" rx="4" fill="url(#lbBody)"/>
