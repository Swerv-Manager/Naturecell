<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/naturecell-design-system-52829db1-0f36-43fb-be73-a051a3b8e03c/tokens/colors.css">
  <link rel="stylesheet" href="_ds/naturecell-design-system-52829db1-0f36-43fb-be73-a051a3b8e03c/tokens/typography.css">
  <link rel="stylesheet" href="_ds/naturecell-design-system-52829db1-0f36-43fb-be73-a051a3b8e03c/tokens/effects.css">
</helmet>
<sc-if value="{{ isArea }}" hint-placeholder-val="{{ true }}">
  <button type="button" onClick="{{ go }}" style="border:none;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:14px;padding:8px;width:100%;">
    <div style="width:100%;aspect-ratio:1/1;border-radius:999px;background:var(--sage-50);display:flex;align-items:center;justify-content:center;padding:22px;transition:background var(--dur-base),transform var(--dur-base);" style-hover="background:var(--sage-100);transform:translateY(-4px)"><img src="{{ item.img }}" alt="{{ item.label }}" style="max-width:100%;max-height:100%;object-fit:contain;mix-blend-mode:multiply;" /></div>
    <span style="font-family:var(--font-display);font-size:18px;color:var(--sage-700);">{{ item.label }}</span>
  </button>
</sc-if>
<sc-if value="{{ isNeed }}" hint-placeholder-val="{{ false }}">
  <button type="button" onClick="{{ go }}" style="border:1px solid var(--border-soft);background:var(--cloud);border-radius:var(--radius-lg);cursor:pointer;padding:20px;display:flex;align-items:center;gap:14px;text-align:left;width:100%;transition:border-color var(--dur-fast),box-shadow var(--dur-fast);" style-hover="border-color:var(--sage-400);box-shadow:var(--shadow-sm)">
    <div style="width:54px;height:54px;flex:none;border-radius:999px;background:var(--sage-50);display:flex;align-items:center;justify-content:center;padding:7px;"><img src="{{ item.img }}" alt="{{ item.label }}" style="max-width:100%;max-height:100%;object-fit:contain;mix-blend-mode:multiply;" /></div>
    <div style="display:flex;flex-direction:column;gap:3px;">
      <span style="font-family:var(--font-display);font-size:18px;color:var(--sage-700);">{{ item.label }}</span>
      <span style="font-size:13px;color:var(--ink-400);">{{ item.desc }}</span>
    </div>
  </button>
</sc-if>
<sc-if value="{{ isMega }}" hint-placeholder-val="{{ false }}">
  <button type="button" onClick="{{ go }}" style="border:1px solid var(--border-soft);background:var(--cloud);border-radius:var(--radius-lg);cursor:pointer;padding:16px 14px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;width:100%;transition:border-color var(--dur-fast),box-shadow var(--dur-fast);" style-hover="border-color:var(--sage-400);box-shadow:var(--shadow-sm)">
    <div style="width:74px;height:74px;border-radius:999px;background:var(--sage-50);display:flex;align-items:center;justify-content:center;padding:8px;"><img src="{{ item.img }}" alt="{{ item.label }}" style="max-width:100%;max-height:100%;object-fit:contain;mix-blend-mode:multiply;" /></div>
    <span style="font-family:var(--font-display);font-size:16px;color:var(--sage-700);">{{ item.label }}</span>
    <span style="font-size:11.5px;color:var(--ink-400);line-height:1.3;">{{ item.desc }}</span>
  </button>
</sc-if>
<sc-if value="{{ isTile }}" hint-placeholder-val="{{ false }}">
  <button type="button" onClick="{{ go }}" style="border:1px solid var(--border-soft);background:var(--cloud);border-radius:var(--radius-lg);cursor:pointer;padding:0;overflow:hidden;display:flex;flex-direction:column;width:100%;text-align:center;transition:border-color var(--dur-base),box-shadow var(--dur-base),transform var(--dur-base);" style-hover="border-color:var(--sage-400);box-shadow:var(--shadow-sm);transform:translateY(-3px)">
    <div style="width:100%;height:180px;background:var(--sage-50);display:flex;align-items:center;justify-content:center;padding:18px;"><img src="{{ item.img }}" alt="{{ item.label }}" style="height:132px;width:auto;max-width:90%;object-fit:contain;mix-blend-mode:multiply;" /></div>
    <div style="padding:16px 12px 18px;display:flex;flex-direction:column;gap:3px;">
      <span style="font-family:var(--font-display);font-size:18px;color:var(--sage-700);">{{ item.label }}</span>
      <span style="font-size:12.5px;color:var(--ink-400);">{{ item.desc }}</span>
    </div>
  </button>
</sc-if>
<sc-if value="{{ isMini }}" hint-placeholder-val="{{ false }}">
  <button type="button" onClick="{{ go }}" style="border:1px solid var(--border-soft);background:var(--cloud);border-radius:var(--radius-md);cursor:pointer;padding:10px;display:flex;align-items:center;gap:9px;text-align:left;width:100%;">
    <div style="width:38px;height:38px;flex:none;background:var(--sage-50);border-radius:999px;display:flex;align-items:center;justify-content:center;padding:5px;"><img src="{{ item.img }}" alt="" style="max-width:100%;max-height:100%;object-fit:contain;mix-blend-mode:multiply;" /></div>
    <span style="font-family:var(--font-display);font-size:14px;color:var(--sage-700);">{{ item.label }}</span>
  </button>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:160,&quot;height&quot;:190},&quot;item&quot;:{&quot;editor&quot;:null,&quot;default&quot;:{}},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;area&quot;,&quot;need&quot;,&quot;mega&quot;,&quot;mini&quot;],&quot;default&quot;:&quot;area&quot;},&quot;onGo&quot;:{&quot;editor&quot;:null}}">
class Component extends DCLogic {
  renderVals() {
    const it = this.props.item || {};
    const k = this.props.kind || 'area';
    return {
      item: it,
      tint: it.tint || 'var(--sage-50)',
      isArea: k === 'area',
      isNeed: k === 'need',
      isMega: k === 'mega',
      isMini: k === 'mini',
      isTile: k === 'tile',
      go: () => { if (this.props.onGo) this.props.onGo(); },
    };
  }
}
</script>
</body>
</html>
