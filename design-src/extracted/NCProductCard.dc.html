<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/naturecell-design-system-52829db1-0f36-43fb-be73-a051a3b8e03c/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/naturecell-design-system-52829db1-0f36-43fb-be73-a051a3b8e03c/tokens/colors.css">
  <link rel="stylesheet" href="_ds/naturecell-design-system-52829db1-0f36-43fb-be73-a051a3b8e03c/tokens/typography.css">
  <link rel="stylesheet" href="_ds/naturecell-design-system-52829db1-0f36-43fb-be73-a051a3b8e03c/tokens/effects.css">
  <link rel="stylesheet" href="_ds/naturecell-design-system-52829db1-0f36-43fb-be73-a051a3b8e03c/tokens/base.css">
  <script src="_ds/naturecell-design-system-52829db1-0f36-43fb-be73-a051a3b8e03c/_ds_bundle.js"></script>
</helmet>
<div style="display:flex;flex-direction:column;background:var(--cloud);border:1px solid var(--border-soft);border-radius:var(--radius-lg);overflow:hidden;transition:box-shadow var(--dur-base) var(--ease-out),transform var(--dur-base) var(--ease-out);height:100%;" style-hover="box-shadow:var(--shadow-md);transform:translateY(-3px)">
  <div onClick="{{ open }}" onMouseEnter="{{ hoverOn }}" onMouseLeave="{{ hoverOff }}" style="position:relative;aspect-ratio:1/1;min-height:0;overflow:hidden;background:var(--nc-product-tint, color-mix(in srgb, var(--sage-700) 10%, #FFFFFF));cursor:pointer;display:flex;align-items:center;justify-content:center;padding:18px;">
    <div style="position:absolute;top:12px;left:12px;z-index:2;display:flex;flex-direction:column;gap:6px;align-items:flex-start;">
      <sc-if value="{{ hasSave }}" hint-placeholder-val="{{ true }}">
        <x-import component-from-global-scope="NatureCellDesignSystem_52829d.Badge" tone="sale" hint-size="64px,22px">{{ product.save }}</x-import>
      </sc-if>
      <sc-if value="{{ product.bundle }}" hint-placeholder-val="{{ false }}">
        <x-import component-from-global-scope="NatureCellDesignSystem_52829d.Badge" tone="sage" hint-size="64px,22px">Sampakke</x-import>
      </sc-if>
    </div>
    <button type="button" onClick="{{ toggleFav }}" aria-label="Føj til favoritter" style="position:absolute;top:10px;right:10px;z-index:3;width:38px;height:38px;border-radius:999px;border:none;background:rgba(255,255,255,0.9);color:{{ favColor }};cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm);transition:transform var(--dur-fast) var(--ease-out);" style-hover="transform:scale(1.1)">{{ favIcon }}</button>
        <img src="{{ product.img }}" alt="{{ product.name }}" style="width:100%;height:100%;object-fit:contain;object-position:center;mix-blend-mode:multiply;opacity:{{ primaryOpacity }};transition:opacity var(--dur-base) var(--ease-out);" />
    <sc-if value="{{ hasAlt }}" hint-placeholder-val="{{ false }}">
      <img src="{{ altImg }}" alt="{{ product.name }}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;opacity:{{ altOpacity }};transition:opacity var(--dur-base) var(--ease-out);pointer-events:none;" />
    </sc-if>
    <button type="button" onClick="{{ add }}" aria-label="Tilføj til kurv" style="position:absolute;bottom:12px;right:12px;width:42px;height:42px;border-radius:999px;border:none;background:var(--sage-500);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm);transition:background var(--dur-fast) var(--ease-out);" style-hover="background:var(--sage-600)">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>
    </button>
  </div>
  <div style="display:flex;flex-direction:column;gap:7px;padding:18px 18px 20px;flex:1;">
    <span style="font-family:var(--font-body);font-weight:600;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--sage-600);">{{ product.eyebrow }}</span>
    <h3 onClick="{{ open }}" style="margin:0;font-family:var(--font-display);font-weight:400;font-size:1.125rem;line-height:1.25;color:var(--sage-700);cursor:pointer;">{{ product.name }}</h3>
    <span style="font-family:var(--font-body);font-size:0.8125rem;color:var(--ink-400);">{{ product.size }}</span>
    <div style="margin-top:2px;">
      <x-import component-from-global-scope="NatureCellDesignSystem_52829d.Rating" value="{{ product.rating }}" count="{{ product.ratingCount }}" hint-size="120px,18px"></x-import>
    </div>
    <div style="margin-top:auto;padding-top:10px;">
      <x-import component-from-global-scope="NatureCellDesignSystem_52829d.PriceTag" price="{{ product.price }}" compareAt="{{ product.compareAt }}" hint-size="90px,24px"></x-import>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:380},&quot;product&quot;:{&quot;editor&quot;:null,&quot;default&quot;:{}},&quot;onAdd&quot;:{&quot;editor&quot;:null},&quot;onOpen&quot;:{&quot;editor&quot;:null}}">
class Component extends DCLogic {
  state = { fav: false, hovered: false };
  componentDidMount() { this.syncFav(); this._onF = () => this.syncFav(); window.addEventListener('nc-favs-changed', this._onF); }
  componentWillUnmount() { window.removeEventListener('nc-favs-changed', this._onF); }
  getFavs() { try { return JSON.parse(localStorage.getItem('nc_favs') || '[]'); } catch (e) { return []; } }
  syncFav() { const p = this.props.product || {}; const f = this.getFavs().indexOf(p.id) >= 0; if (f !== this.state.fav) this.setState({ fav: f }); }
  toggleFav(e) { if (e && e.stopPropagation) e.stopPropagation(); const p = this.props.product || {}; if (!p.id) return; let favs = this.getFavs(); const i = favs.indexOf(p.id); if (i >= 0) favs.splice(i, 1); else favs.push(p.id); try { localStorage.setItem('nc_favs', JSON.stringify(favs)); } catch (err) {} this.setState({ fav: i < 0 }); window.dispatchEvent(new CustomEvent('nc-favs-changed')); }
  renderVals() {
    const p = this.props.product || {};
    const fav = this.state.fav;
    const heart = fav
      ? React.createElement('svg', { width: 19, height: 19, viewBox: '0 0 24 24', fill: 'currentColor' }, React.createElement('path', { d: 'M12 20.4C7.2 17 4.3 13.6 4.3 10 4.3 7.4 6.2 5.5 8.5 5.5c1.5 0 2.8.8 3.5 2 .7-1.2 2-2 3.5-2 2.3 0 4.2 1.9 4.2 4.5 0 3.6-2.9 7-7.7 10.4Z' }))
      : React.createElement('svg', { width: 19, height: 19, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 1.8, strokeLinecap: 'round', strokeLinejoin: 'round' }, React.createElement('path', { d: 'M12 20.4C7.2 17 4.3 13.6 4.3 10 4.3 7.4 6.2 5.5 8.5 5.5c1.5 0 2.8.8 3.5 2 .7-1.2 2-2 3.5-2 2.3 0 4.2 1.9 4.2 4.5 0 3.6-2.9 7-7.7 10.4Z' }));
    const gal = Array.isArray(p.images) ? p.images : [];
    const altImg = gal.filter(function (g) { return g && g !== p.img; })[0] || null;
    const showAlt = !!altImg && this.state.hovered;
    return {
      product: p,
      hasAlt: !!altImg,
      altImg: altImg,
      altOpacity: showAlt ? 1 : 0,
      primaryOpacity: showAlt ? 0 : 1,
      hoverOn: () => { if (altImg && !this.state.hovered) this.setState({ hovered: true }); },
      hoverOff: () => { if (this.state.hovered) this.setState({ hovered: false }); },
      hasSave: !!p.save,
      favIcon: heart,
      favColor: fav ? 'var(--accent-berry)' : 'var(--ink-400)',
      toggleFav: (e) => this.toggleFav(e),
      add: (e) => { if (e && e.stopPropagation) e.stopPropagation(); if (this.props.onAdd) this.props.onAdd(p.id); },
      open: () => { if (this.props.onOpen) this.props.onOpen(p.id); },
    };
  }
}
</script>
</body>
</html>
