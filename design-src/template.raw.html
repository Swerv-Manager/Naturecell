 80a097 + 3e5d58) -------- */\n  --sage-900: #28403B;\n  --sage-800: #324E48;\n  --sage-700: #3E5D58;   /* OFFICIAL deep green — display text, dark panels */\n  --sage-600: #5A7A72;   /* hover / pressed */\n  --sage-500: #80A097;   /* OFFICIAL primary sage */\n  --sage-400: #9AB4AC;\n  --sage-300: #B6C9C2;\n  --sage-200: #D2DFDB;\n  --sage-100: #E7EEEB;   /* pale sage surface tint */\n  --sage-50:  #F2F6F4;\n\n  /* --- Stone-grey (official 8c8f8f) ----------------------------------- */\n  --stone-600: #6F7271;\n  --stone-500: #8C8F8F;  /* OFFICIAL grey-green neutral */\n  --stone-300: #B9BBB8;\n  --stone-100: #E4E4E0;\n\n  /* --- Warm neutrals (official sand ddbfa3 + light stone d5d1c3) ------- */\n  --sand-500:  #DDBFA3;  /* OFFICIAL sand / tan */\n  --sand-300:  #E8D6C3;\n  --sand-100:  #F4Ece3;\n  --linen-500: #D5D1C3;  /* OFFICIAL light stone */\n  --linen-300: #E3E0D6;\n  --linen-100: #F1EFE8;\n\n  /* --- Paper / page neutrals (warm, never stark) ---------------------- */\n  --paper:    #F6F4EE;   /* primary page background */\n  --paper-2:  #FBFAF5;   /* raised cards on paper */\n  --cloud:    #FFFFFF;   /* OFFICIAL white — product photography ground */\n\n  /* --- Ink / greyscale (green-tinted charcoals) ----------------------- */\n  --ink-900:  #233330;   /* primary text (near deep-green) */\n  --ink-700:  #3C4744;\n  --ink-500:  #5E6764;\n  --ink-400:  #828A87;\n  --ink-300:  #AAB0AD;\n  --ink-200:  #D3D6D1;\n  --ink-100:  #E7E8E2;\n\n  /* --- Accent colours — use SPARINGLY (balance & focus only) ----------- */\n  --accent-mauve: #B07A7F;  /* OFFICIAL */\n  --accent-pink:  #F9B5C4;  /* OFFICIAL */\n  --accent-berry: #84334E;  /* OFFICIAL — deepest accent, sale flags */\n\n  /* --- Legacy packaging \"thread\" hairlines (sampled from packs) -------- */\n  /* The single diagonal line on each pack. Kept for packaging fidelity.  */\n  --thread-mauve:    var(--accent-mauve);\n  --thread-pink:     var(--accent-pink);\n  --thread-sand:     var(--sand-500);\n  --thread-sage:     var(--sage-400);\n\n  /* --- Semantic status ------------------------------------------------- */\n  --success: #3E5D58;\n  --warning: #B89169;\n  --danger:  #84334E;\n  --info:    #8C8F8F;\n  --sale:    #84334E;   /* berry — \"SPAR %\" flags */\n\n  /* =====================================================================\n     SEMANTIC ALIASES — reach for these in product/UI code\n     ===================================================================== */\n\n  /* Surfaces */\n  --surface-page:      var(--paper);\n  --surface-card:      var(--cloud);\n  --surface-raised:    var(--paper-2);\n  --surface-sage:      var(--sage-100);\n  --surface-sage-deep: var(--sage-500);\n  --surface-green-deep: var(--sage-700);\n  --surface-sand:      var(--sand-100);\n  --surface-ink:       var(--ink-900);\n  --surface-photo:     var(--cloud);\n\n  /* Text */\n  --text-strong:    var(--ink-900);\n  --text-body:      var(--ink-700);\n  --text-muted:     var(--ink-500);\n  --text-faint:     var(--ink-400);\n  --text-on-sage:   var(--cloud);\n  --text-on-ink:    var(--paper);\n  --text-brand:     var(--sage-700);\n\n  /* Lines & borders */\n  --border-soft:    var(--ink-100);\n  --border-default: var(--ink-200);\n  --border-strong:  var(--ink-300);\n  --border-sage:    var(--sage-200);\n\n  /* Interactive (primary = sage) */\n  --action:           var(--sage-500);\n  --action-hover:     var(--sage-600);\n  --action-pressed:   var(--sage-700);\n  --action-contrast:  var(--cloud);\n  --focus-ring:       var(--sage-600);\n\n  /* Brand mark colours */\n  --brand-sage:     var(--sage-500);\n  --brand-green:    var(--sage-700);\n  --brand-ink:      var(--ink-900);\n}\n<\u002Fstyle>\n  <style>/* ===========================================================================\n   NatureCell Denmark — Typography tokens\n   Calm, airy, Nordic. Generous letter-spacing on caps (echoes \"DENMARK\").\n   =========================================================================== */\n\n:root {\n  /* --- Families (per BrandGuide) --------------------------------------- */\n  /* Philosopher = ALL headlines/overskrifter. Roboto Flex = body + UI + */\n  /* eyebrows + prices. --font-serif aliases Philosopher for editorial.   */\n  --font-display: 'Philosopher', Georgia, 'Times New Roman', serif;\n  --font-body:    'Roboto Flex', 'Helvetica Neue', Arial, sans-serif;\n  --font-serif:   'Philosopher', Georgia, 'Times New Roman', serif;\n\n  /* --- Weights --------------------------------------------------------- */\n  --weight-light:    300;\n  --weight-regular:  400;\n  --weight-medium:   500;\n  --weight-semibold: 600;\n  --weight-bold:     700;\n\n  /* --- Type scale (1.250 major-third, 16px base) ----------------------- */\n  --text-2xs: 0.6875rem;  /* 11px — legal, oz/ml microcopy */\n  --text-xs:  0.75rem;    /* 12px — labels, eyebrows */\n  --text-sm:  0.875rem;   /* 14px — captions, meta */\n  --text-md:  1rem;       /* 16px — body */\n  --text-lg:  1.125rem;   /* 18px — lead body */\n  --text-xl:  1.375rem;   /* 22px — card titles */\n  --text-2xl: 1.75rem;    /* 28px — section headings */\n  --text-3xl: 2.25rem;    /* 36px — page headings */\n  --text-4xl: 3rem;       /* 48px — hero */\n  --text-5xl: 4rem;       /* 64px — display hero */\n\n  /* --- Line heights ---------------------------------------------------- */\n  --leading-tight:   1.1;\n  --leading-snug:    1.25;\n  --leading-normal:  1.5;\n  --leading-relaxed: 1.7;\n\n  /* --- Letter-spacing -------------------------------------------------- */\n  --tracking-tight:   -0.01em;\n  --tracking-normal:  0;\n  --tracking-wide:    0.04em;\n  --tracking-wider:   0.12em;   /* product eyebrows: \"CBD SKIN CARE\" */\n  --tracking-widest:  0.24em;   /* \"DENMARK\" lockup spacing */\n\n  /* =====================================================================\n     SEMANTIC ROLES\n     ===================================================================== */\n\n  /* Eyebrow / overline — letter-spaced caps in the BODY face (Roboto Flex), */\n  /* matching the sans labels on packaging (\"CBD SKIN CARE\").                */\n  --type-eyebrow-family:   var(--font-body);\n  --type-eyebrow-size:     var(--text-xs);\n  --type-eyebrow-weight:   var(--weight-semibold);\n  --type-eyebrow-tracking: var(--tracking-wider);\n\n  /* Display + headings — Philosopher (Regular 400 default, Bold 700) */\n  --type-display-family: var(--font-display);\n  --type-display-weight: var(--weight-regular);\n\n  --type-heading-family: var(--font-display);\n  --type-heading-weight: var(--weight-bold);\n\n  /* Body */\n  --type-body-family: var(--font-body);\n  --type-body-weight: var(--weight-regular);\n  --type-body-size:   var(--text-md);\n  --type-body-leading: var(--leading-relaxed);\n\n  /* Editorial (customer stories, pull quotes) — Philosopher italic */\n  --type-editorial-family:  var(--font-serif);\n  --type-editorial-weight:  var(--weight-regular);\n}\n<\u002Fstyle>\n  <style>/* ===========================================================================\n   NatureCell Denmark — Spacing & layout tokens\n   8px base rhythm, generous Nordic whitespace.\n   =========================================================================== */\n\n:root {\n  /* --- Spacing scale (8px base) --------------------------------------- */\n  --space-0:   0;\n  --space-1:   0.25rem;  /* 4 */\n  --space-2:   0.5rem;   /* 8 */\n  --space-3:   0.75rem;  /* 12 */\n  --space-4:   1rem;     /* 16 */\n  --space-5:   1.5rem;   /* 24 */\n  --space-6:   2rem;     /* 32 */\n  --space-7:   2.5rem;   /* 40 */\n  --space-8:   3rem;     /* 48 */\n  --space-9:   4rem;     /* 64 */\n  --space-10:  5rem;     /* 80 */\n  --space-12:  7.5rem;   /* 120 — section breathing room */\n\n  /* --- Layout --------------------------------------------------------- */\n  --container-max:  1240px;\n  --container-text: 680px;   /* editorial measure */\n  --gutter:         var(--space-5);\n  --section-y:      var(--space-10);\n}\n<\u002Fstyle>\n  <style>/* ===========================================================================\n   NatureCell Denmark — Radii, borders, shadows, motion\n   Soft, organic, low-contrast. Shadows are barely-there and warm-tinted,\n   never hard drop-shadows. Corners are gently rounded — calm, not playful.\n   =========================================================================== */\n\n:root {\n  /* --- Radii ---------------------------------------------------------- */\n  --radius-xs:   4px;\n  --radius-sm:   8px;\n  --radius-md:   12px;    /* default cards, inputs */\n  --radius-lg:   18px;    /* feature cards, media */\n  --radius-xl:   28px;    /* hero panels */\n  --radius-pill: 999px;   /* buttons, chips, pills */\n  --radius-circle: 50%;\n\n  /* --- Borders -------------------------------------------------------- */\n  --border-hairline: 1px solid var(--border-default);\n  --border-soft-1:   1px solid var(--border-soft);\n  --border-sage-1:   1px solid var(--border-sage);\n\n  /* --- Shadows — soft, green-tinted, diffuse -------------------------- */\n  --shadow-xs:  0 1px 2px rgba(62, 93, 88, 0.06);\n  --shadow-sm:  0 2px 8px rgba(62, 93, 88, 0.07);\n  --shadow-md:  0 6px 20px rgba(62, 93, 88, 0.09);\n  --shadow-lg:  0 14px 40px rgba(62, 93, 88, 0.12);\n  --shadow-focus: 0 0 0 3px rgba(128, 160, 151, 0.35);\n\n  /* --- Motion — gentle, never bouncy ---------------------------------- */\n  --ease-out:   cubic-bezier(0.22, 0.61, 0.36, 1); /* @kind other */\n  --ease-soft:  cubic-bezier(0.4, 0, 0.2, 1);       /* @kind other */\n  --dur-fast:   140ms;  /* @kind other */\n  --dur-base:   240ms;  /* @kind other */\n  --dur-slow:   420ms;  /* @kind other */\n\n  /* --- Z-index -------------------------------------------------------- */\n  --z-base:    1;     /* @kind other */\n  --z-sticky:  100;   /* @kind other */\n  --z-overlay: 1000;  /* @kind other */\n  --z-modal:   1100;  /* @kind other */\n  --z-toast:   1200;  /* @kind other */\n}\n<\u002Fstyle>\n  <style>/* ===========================================================================\n   NatureCell Denmark — Base layer\n   Light, opinionated resets + a few text-role helpers. Optional for consumers\n   but keeps specimens and UI kits consistent.\n   =========================================================================== */\n\n*, *::before, *::after { box-sizing: border-box; }\n\nbody {\n  margin: 0;\n  font-family: var(--font-body);\n  font-size: var(--text-md);\n  line-height: var(--leading-relaxed);\n  color: var(--text-body);\n  background: var(--surface-page);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\n/* --- Text roles ------------------------------------------------------- */\n.nc-eyebrow {\n  font-family: var(--type-eyebrow-family);\n  font-size: var(--type-eyebrow-size);\n  font-weight: var(--type-eyebrow-weight);\n  letter-spacing: var(--type-eyebrow-tracking);\n  text-transform: uppercase;\n  color: var(--text-brand);\n}\n\n.nc-display {\n  font-family: var(--type-display-family);\n  font-weight: var(--type-display-weight);\n  line-height: var(--leading-tight);\n  letter-spacing: var(--tracking-tight);\n  color: var(--text-strong);\n  margin: 0;\n}\n\n.nc-heading {\n  font-family: var(--type-heading-family);\n  font-weight: var(--type-heading-weight);\n  line-height: var(--leading-snug);\n  color: var(--text-strong);\n  margin: 0;\n}\n\n.nc-body { font-family: var(--font-body); color: var(--text-body); }\n\n.nc-editorial {\n  font-family: var(--type-editorial-family);\n  font-weight: var(--type-editorial-weight);\n  line-height: var(--leading-relaxed);\n  color: var(--text-body);\n}\n\n/* --- The DENMARK lockup spacing helper -------------------------------- */\n.nc-spaced { letter-spacing: var(--tracking-widest); text-transform: uppercase; }\n\na { color: var(--text-brand); text-decoration-thickness: 1px; text-underline-offset: 2px; }\n<\u002Fstyle>\n  <script src=\"6ca7d1a4-5f6c-4c8a-8c86-262d244bdf40\"><\u002      <div style=\"display:flex;flex-direction:column;gap:14px;margin-bottom:28px;\">\n          <span style=\"font-family:var(--font-body);font-weight:600;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:var(--sage-600);\">{{ curArticle.tag }}<\u002Fspan>\n          <h1 style=\"margin:0;font-family:var(--font-display);font-weight:400;font-size:clamp(25px,3.9vw,40px);line-height:1.1;letter-spacing:-0.01em;color:var(--sage-700);\">{{ curArticle.title }}<\u002Fh1>\n        <\u002Fdiv>\n      <\u002Farticle>\n      <div style=\"max-width:1000px;margin:0 auto;padding:0 clamp(16px,4vw,24px);\">\n        <div style=\"position:relative;width:100%;aspect-ratio:16/9;border-radius:var(--radius-xl);overflow:hidden;background:var(--sage-50);\">\n          <img src=\"{{ curArticle.img }}\" alt=\"{{ curArticle.title }}\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <article style=\"max-width:680px;margin:0 auto;padding:clamp(24px,5vw,40px) clamp(16px,4vw,24px) clamp(12px,6vw,20px);\">\n        <p style=\"margin:0 0 24px;font-family:var(--font-serif);font-size:21px;line-height:1.55;color:var(--sage-700);\">{{ curArticle.excerpt }}<\u002Fp>\n        <sc-if value=\"{{ curArticleHasBody }}\" hint-placeholder-val=\"{{ false }}\">\n          <div class=\"nc-article-body\" style=\"border-top:1px solid var(--border-soft);padding-top:28px;\">{{ curArticleBodyEl }}<\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ curArticleNoBody }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"border-top:1px solid var(--border-soft);padding-top:24px;display:flex;flex-direction:column;gap:16px;\">\n            <p style=\"margin:0;font-size:16px;line-height:1.8;color:var(--ink-700);\">Denne artikel er en del af NatureCells univers om CBD og hudpleje. Vi deler vores egne erfaringer og fagfolks råd — altid med fokus på ærlighed frem for løfter.<\u002Fp>\n            <a href=\"https://naturecell.dk/blogs/artikler/{{ curArticle.slug }}\" target=\"_blank\" rel=\"noopener\" style=\"align-self:flex-start;display:inline-flex;align-items:center;gap:8px;border:none;cursor:pointer;background:var(--sage-500);color:#fff;font-family:var(--font-body);font-weight:600;font-size:15px;padding:14px 26px;border-radius:999px;text-decoration:none;\">Læs hele artiklen på naturecell.dk <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M7 17 17 7\"><\u002Fpath><path d=\"M7 7h10v10\"><\u002Fpath><\u002Fsvg><\u002Fa>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Farticle>\n      <section style=\"max-width:1000px;margin:0 auto;padding:clamp(24px,5vw,40px) clamp(16px,4vw,24px) clamp(48px,6vw,80px);border-top:1px solid var(--border-soft);\">\n        <h2 style=\"margin:0 0 22px;font-family:var(--font-display);font-weight:400;font-size:26px;color:var(--sage-700);\">Læs også<\u002Fh2>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(47%,260px),1fr));gap:24px;\">\n          <sc-for list=\"{{ curArticleMore }}\" as=\"a\" hint-placeholder-count=\"3\">\n            <button type=\"button\" sc-camel-on-click=\"{{ a.go }}\" style=\"border:none;background:none;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:12px;padding:0;\">\n              <div style=\"position:relative;width:100%;aspect-ratio:4/3;border-radius:var(--radius-lg);overflow:hidden;background:var(--sage-50);\">\n                <img src=\"{{ a.img }}\" alt=\"{{ a.title }}\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;\">\n                <span style=\"position:absolute;top:10px;left:10px;background:var(--paper);color:var(--sage-700);font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:4px 9px;border-radius:999px;\">{{ a.tag }}<\u002Fspan>\n              <\u002Fdiv>\n              <h3 style=\"margin:0;font-family:var(--font-display);font-size:18px;line-height:1.25;color:var(--sage-700);\">{{ a.title }}<\u002Fh3>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <!-- ============ OM CBD ============ -->\n    <sc-if value=\"{{ isOmcbd }}\" hint-placeholder-val=\"{{ false }}\">\n      <section style=\"position:relative;background:var(--sage-500);color:var(--paper);overflow:hidden;\">\n        <img src=\"4f82d3d8-9c98-452d-8eaa-26d52c08426b\" alt=\"\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0.22;\">\n        <div style=\"position:absolute;inset:0;background:linear-gradient(90deg,var(--sage-700),rgba(40,64,59,0.55));\"><\u002Fdiv>\n        <div style=\"position:relative;max-width:820px;margin:0 auto;padding:104px 24px;display:flex;flex-direction:column;gap:18px;\">\n          <span style=\"font-family:var(--font-body);font-weight:600;font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:var(--sage-200);\">Kom godt i gang med CBD<\u002Fspan>\n          <h1 style=\"margin:0;font-family:var(--font-display);font-weight:400;font-size:clamp(40px,5.5vw,64px);line-height:1.03;letter-spacing:-0.01em;color:var(--paper);\">Hvad er CBD?<\u002Fh1>\n          <p style=\"margin:0;font-size:19px;line-height:1.7;color:rgba(246,244,238,0.88);max-width:620px;\">Alt du behøver at vide om cannabidiol — hvad det er, hvorfor vi bruger det i hudpleje, og hvad der gør NatureCells CBD særlig.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- Hvad er CBD -->\n      <section style=\"background:var(--paper);\">\n        <div style=\"max-width:1140px;margin:0 auto;padding:clamp(46px,6vw,84px) clamp(16px,4vw,24px);display:flex;gap:clamp(26px,5vw,56px);align-items:center;flex-wrap:wrap;\">\n          <div style=\"flex:1 1 360px;min-width:280px;display:flex;flex-direction:column;gap:18px;\">\n            <span style=\"font-family:var(--font-body);font-weight:600;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:var(--sage-600);\">En naturlig forbindelse<\u002Fspan>\n            <h2 style=\"margin:0;font-family:var(--font-display);font-weight:400;font-size:clamp(22px,3.5vw,36px);line-height:1.1;color:var(--sage-700);\">Hvad er CBD?<\u002Fh2>\n            <p style=\"margin:0;font-size:16px;line-height:1.8;color:var(--ink-700);\">CBD ekstraheres fra bladene på hampeplanten og kaldes en <strong style=\"font-weight:600;\">cannabinoid<\u002Fstrong> — en naturlig kemisk forbindelse, der findes i planter fra cannabisfamilien. Der findes mange forskellige typer cannabinoider.<\u002Fp>\n            <p style=\"margin:0;font-size:16px;line-height:1.8;color:var(--ink-700);\">Forskere har opdaget, at både mennesker og dyr har et såkaldt <strong style=\"font-weight:600;\">endocannabinoid-system<\u002Fstrong>, som kroppen selv producerer naturlige cannabinoider til. Det har gjort CBD til en særlig interessant ingrediens i hudpleje, fordi den deler strukturelle ligheder med de stoffer, kroppen selv danner.<\u002Fp>\n            <p style=\"margin:0;font-size:16px;line-height:1.8;color:var(--ink-700);\">CBD er rig på antioxidanter og fedtsyrer og anvendes i kosmetik for sine <strong style=\"font-weight:600;\">plejende og balancerende egenskaber<\u002Fstrong>, der kan bidrage til et mere harmonisk og velplejet udseende af huden.<\u002Fp>\n            <div style=\"display:flex;gap:12px;align-items:flex-start;background:var(--sage-50);border:1px solid var(--border-sage,var(--border-soft));border-radius:var(--radius-lg);padding:18px 20px;margin-top:6px;\">\n              <span style=\"flex:none;color:var(--sage-600);margin-top:1px;\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 2 4 5v6c0 5 3.5 8 8 11 4.5-3 8-6 8-11V5Z\"><\u002Fpath><path d=\"m9 12 2 2 4-4\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n              <p style=\"margin:0;font-size:14.5px;line-height:1.65;color:var(--ink-700);\">CBD er en tilladt ingrediens i hudpleje under EU’s kosmetiklovgivning. Allerede i <strong style=\"font-weight:600;\">2019 fik NatureCell tilladelse<\u002Fstrong> til at tilsætte CBD til vores hudpleje, da ingrediensen blev vurderet som kosmetisk og ikke medicinsk.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1 1 360px;min-width:280px;\">\n            <img src=\"4f82d3d8-9c98-452d-8eaa-26d52c08426b\" alt=\"CBD hampeplante\" style=\"width:100%;height:460px;object-fit:cover;border-radius:var(--radius-xl);box-shadow:var(--shadow-md);display:block;\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- CBD i hudpleje -->\n      <section style=\"background:var(--sage-50);border-top:1px solid var(--border-soft);border-bottom:1px solid var(--border-soft);\">\n        <div style=\"max-width:1140px;margin:0 auto;padding:clamp(46px,6vw,84px) clamp(16px,4vw,24px);display:flex;flex-direction:row-reverse;gap:clamp(26px,5vw,56px);align-items:center;flex-wrap:wrap;\">\n          <div style=\"flex:1 1 360px;min-width:280px;display:flex;flex-direction:column;gap:18px;\">\n            <span style=\"font-family:var(--font-body);font-weight:600;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:var(--sage-600);\">I harmoni med huden<\u002Fspan>\n            <h2 style=\"margin:0;font-family:var(--font-display);font-weight:400;font-size:clamp(22px,3.5vw,36px);line-height:1.1;color:var(--sage-700);\">CBD i hudpleje<\u002Fh2>\n            <p style=\"margin:0;font-size:16px;line-height:1.8;color:var(--ink-700);\">Huden er kroppens største organ og fungerer som vores naturlige barriere mod omgivelserne. CBD er en cannabinoid — et plantebaseret stof, som ligner nogle af de stoffer kroppen selv kan producere. Det gør CBD til en interessant ingrediens i hudpleje, da den arbejder i harmoni med hudens naturlige balance.<\u002Fp>\n            <p style=\"margin:0;font-size:16px;line-height:1.8;color:var(--ink-700);\">CBD er rig på antioxidanter og fedtsyrer — en kombination, der gør den til en særlig og værdsat ingrediens i moderne hudpleje. NatureCell kombinerer CBD med ingredienser af naturlig oprindelse for at give huden optimal pleje, fugt og et mere balanceret udtryk.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"flex:1 1 360px;min-width:280px;\">\n            <img src=\"70946e72-4e01-4a47-96c2-5b01ed6dbacf\" alt=\"CBD hudpleje\" style=\"width:100%;height:460px;object-fit:cover;border-radius:var(--radius-xl);box-shadow:var(--shadow-md);display:block;\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- Velegnet til alle hudtyper -->\n      <section style=\"background:var(--paper);\">\n        <div style=\"max-width:1180px;margin:0 auto;padding:clamp(46px,6vw,84px) clamp(16px,4vw,24px);\">\n          <div style=\"text-align:center;max-width:680px;margin:0 auto 44px;display:flex;flex-direction:column;gap:12px;align-items:center;\">\n            <span style=\"font-family:var(--font-body);font-weight:600;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:var(--sage-600);\">One-size-fits-all<\u002Fspan>\n            <h2 style=\"margin:0;font-family:var(--font-display);font-weight:400;font-size:clamp(24px,3.7vw,38px);line-height:1.08;color:var(--sage-700);\">Velegnet til alle hudtyper<\u002Fh2>\n            <p style=\"margin:0;font-size:16px;line-height:1.7;color:var(--ink-500);\">NatureCell CBD hudpleje er udviklet til at passe enhver hud. Find din type herunder.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(47%,280px),1fr));gap:32px;align-items:stretch;\">\n            <div style=\"display:flex;flex-direction:column;gap:6px;\">\n              <sc-for list=\"{{ cbdSkinList }}\" as=\"s\" hint-placeholder  type=\"button\" sc-camel-on-click=\"{{ cbdSkinGo }}\" style=\"align-self:flex-start;border:none;background:none;cursor:pointer;font-family:var(--font-body);font-weight:600;font-size:14.5px;color:var(--sage-700);padding:0;display:inline-flex;align-items:center;gap:7px;margin-top:4px;\">{{ cbdSkinActive.linkLabel }} <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14\"><\u002Fpath><path d=\"m13 6 6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- VISUAL PRODUCT BANNER -->\n      <section style=\"position:relative;min-height:420px;display:flex;align-items:center;overflow:hidden;\">\n        <img src=\"cdca9c34-920c-47ba-8d85-c21e3f71f7bf\" alt=\"NatureCell CBD hudpleje sortiment\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;\">\n        <div style=\"position:absolute;inset:0;background:linear-gradient(90deg,rgba(31,45,41,0.74),rgba(31,45,41,0.15));\"><\u002Fdiv>\n        <div style=\"position:relative;max-width:1180px;margin:0 auto;padding:clamp(40px,6vw,72px) clamp(16px,4vw,24px);width:100%;\">\n          <div style=\"max-width:460px;display:flex;flex-direction:column;gap:16px;\">\n            <span style=\"font-family:var(--font-body);font-weight:600;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:rgba(246,244,238,0.85);\">Hele serien<\u002Fspan>\n            <h2 style=\"margin:0;font-family:var(--font-display);font-weight:400;font-size:clamp(30px,4vw,44px);line-height:1.08;color:#fff;\">Én serie — til hele din rutine<\u002Fh2>\n            <p style=\"margin:0;font-size:16px;line-height:1.7;color:rgba(246,244,238,0.9);\">Rens, creme, olie og mere — plantebaseret CBD-hudpleje til ansigt og krop.<\u002Fp>\n            <but -6\"><\u002Fpath><\u002Fsvg> Vores historie<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"max-width:1240px;margin:0 auto;padding:clamp(20px,5vw,34px) clamp(16px,4vw,24px) clamp(34px,6vw,56px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:clamp(28px,5vw,56px);align-items:center;\">\n          <div style=\"display:flex;flex-direction:column;gap:18px;\">\n            <span style=\"align-self:flex-start;background:rgba(246,244,238,0.16);color:var(--paper);font-family:var(--font-body);font-weight:600;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;padding:6px 13px;border-radius:999px;\">{{ curMilestone.eyebrow }} · {{ curMilestone.year }}<\u002Fspan>\n            <h1 style=\"margin:0;font-family:var(--font-display);font-weight:400;font-size:clamp(38px,5vw,60px);line-height:1.04;letter-spacing:-0.01em;color:var(--paper);\">{{ curMilestone.title }}<\u002Fh1>\n            <p style=\"margin:0;font-family:var(--font-serif);font-style:italic;font-size:21px;line-height:1.5;color:rgba(246,244,238,0.9);\">{{ curMilestone.lead }}<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border-radius:var(--radius-xl);overflow:hidden;aspect-ratio:4/3;box-shadow:0 30px 60px rgba(0,0,0,0.28);\">\n            <img src=\"{{ curMilestone.img }}\" alt=\"{{ curMilestone.title }}\" style=\"width:100%;height:100%;object-fit:cover;display:block;\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n      <section style=\"background:var(--paper-2);border-bottom:1px solid var(--border-soft);\">\n        <div style=\"max-width:900px;margin:0 auto;padding:22px 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:20px;\">\n          <sc-for list=\"{{ curMilestoneFacts }}\" as=\"f\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex;flex-direction:column;gap:3px;text-align:center;\">\n              <span style=\"font-family:var(--font-body);font-weight:600;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--sage-600);\">{{ f.k }}<\u002Fspan>\n              <span style=\"font-family:var(--font-display);font-size:19px;color:var(--sage-700);\">{{ f.v }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n      <article style=\"max-width:700px;margin:0 auto;padding:clamp(35px,5vw,58px) clamp(16px,4vw,24px) clamp(12px,6vw,20px);display:flex;flex-direction:column;gap:2px;\">\n        <sc-for list=\"{{ curMilestoneParas }}\" as=\"para\" hint-placeholder-count=\"3\">\n          <p style=\"margin:14px 0;font-size:17px;line-height:1.85;color:var(--ink-700);\">{{ para }}<\u002Fp>\n        <\u002Fsc-for>\n      <\u002Farticle>\n      <section style=\"max-width:1100px;margin:0 auto;padding:clamp(24px,5vw,40px) clamp(16px,4vw,24px) clamp(48px,6vw,80px);border-top:1px solid var(--border-soft);\">\n        <h2 style=\"margin:0 0 24px;font-family:var(--font-display);font-weight:400;font-size:26px;color:var(--sage-700);\">Flere nedslag i historien<\u002Fh2>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(47%,240px),1fr));gap:20px;\">\n          <sc-for list=\"{{ milestoneOthers }}\" as=\"o\" hint-placeholder-count=\"3\">\n            <button type=\"button\" sc-camel-on-click=\"{{ o.go }}\" style=\"border:none;background:none;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:12px;padding:0;\">\n              <div style=\"position:relative;width:100%;aspect-ratio:4/3;border-radius:var(--radius-lg);overflow:hidden;background:var(--sage-50);\">\n                <img src=\"{{ o.img }}\" alt=\"{{ o.title }}\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;\">\n                <span style=\"position:absolute;top:10px;left:10px;background:var(--paper);color:var(--sage-700);font-family:var(--font-display);font-size:15px;padding:3px 12px;border-radius:999px;\">{{ o.year }}<\u002Fspan>\n              <\u002Fdiv>\n              <h3 style=\"margin:0;font-family:var(--font-display);font-size:19px;line-height:1.2;color:var(--sage-700);\">{{ o.title }}<\u002Fh3>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <!-- ============ KUNDEKLUB ============ -->\n    <sc-if value=\"{{ isKundeklub }}\" hint-placeholder-val=\"{{ false }}\">\n      <section style=\"position:relative;background:var(--sage-500);color:var(--paper);overflow:hidden;\">\n        <div style=\"max-width:760px;margin:0 auto;padding:clamp(48px,6vw,88px) clamp(16px,4vw,24px);display:flex;flex-direction:column;gap:18px;position:relative;\">\n          <span style=\"font-family:var(--font-body);font-weight:600;font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:var(--sage-200);\">Bliv medlem · gratis<\u002Fspan>\n          <h1 style=\"margin:0;font-family:var(--font-display);font-weight:400;font-size:clamp(38px,5vw,58px);line-height:1.05;color:var(--paper);\">NatureCell Kundeklub<\u002Fh1>\n          <p style=\"margin:0;font-size:18px;line-height:1.7;color:rgba(246,244,238,0.85);max-width:560px;\">Bliv en del af klubben og få mere ud af din hudpleje. Optjen point på hvert køb, få 10% velkomstrabat, en fødselsdagsgave og tidlig adgang til nyheder og medlemspriser.<\u002Fp>\n          <div style=\"display:flex;gap:12px;flex-wrap:wrap;margin-top:6px;\">\n            <button type=\"button\" style=\"border:none;cursor:pointer;background:var(--paper);color:var(--sage-700);font-family:var(--font-body);font-weight:600;font-size:15px;padding:15px 28px;border-radius:999px;\" style-hover=\"transform:translateY(-2px)\">Bliv medlem →<\u002Fbutton>\n            <button type=\"button\" style=\"cursor:pointer;background:transparent;color:var(--paper);border:1.5px solid rgba(246,244,238,0.4);font-family:var(--font-body);font-weight:600;font-size:15px;padding:15px clamp(18px,5vw,28px);border-radius:999px;white-space:nowrap;\" style-hover=\"border-color:var(--paper)\">Allerede medlem? Log ind<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n      <section style=\"max-width:1240px;margin:0 auto;padding:clamp(43px,5vw,72px) clamp(16px,4vw,24px) clamp(17px,6vw,28px);\">\n        <div style=\"display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;margin-bottom:40px;\">\n          <span style=\"font-family:var(--font-body);font-weight:600;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:var(--sage-600);\">Medlemsfordele<\u002Fspan>\n          <h2 style=\"margin:0;font-family:var(--font-display);font-weight:400;font-size:clamp(21px,3.3vw,34px);color:var(--sage-700);\">Fordele der plejer dig<\u002Fh2>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(47%,240px),1fr));gap:20px;\">\n          <sc-for list=\"{{ kundeklubPerks }}\" as=\"p\" hint-placeholder-count=\"4\">\n            <div style=\"background:var(--cloud);border:1px solid var(--border-soft);border-radius:var(--radius-lg);padding:28px;display:flex;flex-direction:column;gap:12px;\">\n              <span style=\"width:52px;height:52px;border-radius:999px;background:var(--sage-100);color:var(--sage-700);display:flex;align-items:center;justify-content:center;\">{{ p.icon }}<\u002Fspan>\n              <h3 style=\"margin:0;font-family:var(--font-display);font-weight:400;font-size:20px;color:var(--sage-700);\">{{ p.title }}<\u002Fh3>\n              <p style=\"margin:0;font-size:14.5px;line-height:1.65;color:var(--ink-500);\">{{ p.text }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n      <section style=\"background:var(--sage-50);border-top:1px solid var(--border-soft);border-bottom:1px solid var(--border-soft);\">\n        <div style=\"max-width:1000px;margin:0 auto;padding:clamp(35px,6vw,64px) clamp(16px,4vw,24px);\">\n          <h2 style=\"margin:0 0 34px;font-family:var(--font-display);font-weight:400;font-size:clamp(19px,2.9vw,30px);color:var(--sage-700);text-align:center;\">Sådan virker det<\u002Fh2>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(47%,220px),1fr));gap:28px;\">\n            <sc-for list=\"{{ kundeklubSteps }}\" as=\"s\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex;flex-direction:column;gap:8px;text-align:center;align-items:center;\">\n                <span style=\"font-family:var(--font-display);font-size:clamp(21px,3.3vw,34px);color:var(--sage-400);\">{{ s.n }}<\u002Fspan>\n                <h3 style=\"margin:0;font-family:var(--font-display);font-weight:400;font-size:19px;color:var(--sage-700);\">{{ s.title }}<\u002Fh3>\n                <p style=\"margin:0;font-size:14px;line-height:1.6;color:var(--ink-500);max-width:280px;\">{{ s.text }}<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n      <section style=\"max-width:680px;margin:0 auto;padding:clamp(40px,6vw,72px) clamp(16px,4vw,24px);text-align:center;display:flex;flex-direction:column;gap:18px;align-items:center;\">\n        <h2 style=\"margin:0;font-family:var(--font-display);font-weight:400;font-size:clamp(19px,2.9vw,30px);color:var(--sage-700);\">Meld dig ind på 30 sekunder<\u002Fh2>\n        <p style=\"margin:0;font-size:16px;line-height:1.7;color:var(--ink-500);\">Tilmeld dig med din e-mail og få 10% på din første ordre med det samme.<\u002Fp>\n        <div style=\"display:flex;gap:10px;width:100%;max-width:440px;\">\n          <input type=\"email\" placeholder=\"din@email.dk\" style=\"flex:1;min-width:0;border:1px solid var(--border-default);background:var(--cloud);border-radius:999px;padding:14px 18px;font-family:var(--font-body);font-size:15px;outline:none;color:var(--sage-700);\">\n          <button type=\"button\" style=\"border:none;cursor:pointer;background:var(--sage-500);color:#fff;font-family:var(--font-body);font-weight:600;font-size:15px;padding:14px 26px;border-radius:999px;\" style-hover=\"background:var(--sage-600)\">Bliv medlem<\u002Fbutton>\n        <\u002Fdiv>\n        <p style=\"margin:4px 0 0;font-size:12.5px;color:var(--ink-400);\">Gratis medlemskab · afmeld når som helst · vi deler ikke dine data.<\u002Fp>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <!-- ============ ABOUT ============ -->\n    <sc-if value=\"{{ isAbout }}\" hint-placeholder-val=\"{{ false }}\">\n      <section style=\"position:relative;background:var(--sage-500);color:var(--paper);overflow:hidden;\">\n        <div style=\"max-width:760px;margin:0 auto;padding:clamp(50px,6vw,90px) clamp(16px,4vw,24px);display:flex;flex-direction:column;gap:18px;position:relative;\">\n          <span style=\"font-family:var(--font-body);font-weight:600;font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:var(--sage-200);\">Vores historie<\u002Fspan>\n          <h1 style=\"margin:0;font-family:var(--font-display);font-weight:400;font-size:clamp(38px,5vw,58px);line-height:1.05;color:var(--paper);\">Vi var de første — og vi gør det ærligt.<\u002Fh1>\n          <p style=\"margin:0;font-size:18px;line-height:1.7;color:rgba(246,244,238,0.85);max-width:560px;\">NatureCell blev i 2019 den første CBD-hudplejeserie godkendt til salg i Danmark. Vi er en familiedrevet virksomhed med rødder på Møllerup Gods, bygget på ærlighed frem for løfter.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsection>\n      <section style=\"background:var(--sage-50);border-top:1px solid var(--border-soft);border-bottom:1px solid var(--border-soft);\">\n        <div style=\"max-width:1120px;margin:0 auto;padding:clamp(31px,6vw,56px) clamp(16px,4vw,24px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:clamp(26px,4vw,44px);align-items:center;\">\n          <div style=\"position:relative;border-radius:var(--radius-xl);overflow:hidden;aspect-ratio:16/10;background:var(--sage-100);box-shadow:var(--shadow-md);\">\n            <video autoplay=\"true\" muted=\"true\" loop=\"true\" playsinline=\"true\" preload=\"metadata\" poster=\"61f46ac2-157b-4028-8dcf-62ff7ba5978e\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;\">\n              <source src=\"4ae916f6-7fad-4add-bd2e-1da97998c289\" type=\"video/mp4\">\n            <\u002Fvideo>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:16px;\">\n            <span style=\"font-family:var(--font-body);font-weight:600;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:var(--sage-600);\">Mød familien bag<\u002Fspan>\n            <h2 style=\"margin:0;font-family:var(--font-display);font-weight:400;font-size:clamp(19px,2.9vw,30px);line-height:1.1;color:var(--sage-700);\">Ægte mennesker. Ægte dansk hudpleje.<\u002Fh2>\n            <p style=\"margin:0;font-size:16px;line-height:1.75;color:var(--ink-700);\">Vi er Lizbeth og Allan — en dansk familie med rødder på Møllerup Gods. Vi står selv bag hvert valg: råvarerne, formuleringerne og den ærlige måde, vi taler til dig på.<\u002Fp>\n            <p style=\"margin:0;font-family:var(--font-serif);font-style:italic;font-size:19px;line-height:1.5;color:var(--sage-700);\">\"Vi lover ikke mirakler — vi lover ærlighed, dansk kvalitet og produkter, vi selv bruger hver dag.\"<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n      <section style=\"max-width:1000px;margin:0 auto;padding:clamp(35px,6vw,64px) clamp(16px,4vw,24px);\">\n        <div style=\"display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;margin-bottom:40px;\">\n          <span style=\"font-family:var(--font-body);font-weight:600;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:var(--sage-600);\">Vores rejse<\u002Fspan>\n          <h2 style=\"margin:0;font-family:var(--font-display);font-weight:400;font-size:clamp(20px,3.1vw,32px);line-height:1.1;color:var(--sage-700);\">Fra idé til Danmarks førende CBD-hudpleje<\u002Fh2>\n        <\u002Fdiv>\n        <div style=\"max-width:820px;margin:0 auto;\">\n          <sc-for list=\"{{ timeline }}\" as=\"m\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex;gap:clamp(14px,3vw,24px);align-items:stretch;\">\n              <div style=\"scroll-snap-align:start;flex:0 0 20px;display:flex;flex-direction:column;align-items:center;\">\n                <div style=\"width:18px;height:18px;border-radius:999px;background:var(--sage-500);border:3px solid var(--paper);box-shadow:0 0 0 2px var(--sage-200);flex:none;margin-top:6px;\"><\u002Fdiv>\n                <sc-if value=\"{{ m.notLast }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div style=\"width:2px;flex:1;min-height:34px;background:var(--sage-200);margin:6px 0;\"><\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <button type=\"button\" sc-camel-on-click=\"{{ m.mgo }}\" style=\"flex:1;min-width:0;padding:0 0 clamp(26px,5vw,44px);display:flex;gap:clamp(14px,3vw,22px);align-items:center;flex-wrap:wrap;border:none;background:none;cursor:pointer;text-align:left;\">\n                <div style=\"scroll-snap-align:start;flex:0 0 min(190px,40%);max-width:190px;aspect-ratio:3/2;border-radius:var(--radius-lg);overflow:hidden;background:var(--sage-50);box-shadow:var(--shadow-sm);\">\n                  <img src=\"{{ m.img }}\" alt=\"{{ m.title }}\" style=\"width:100%;height:100%;object-fit:cover;display:block;\">\n                <\u002Fdiv>\n                <div style=\"flex:1;min-width:200px;display:flex;flex-direction:column;gap:5px;\">\n                  <span style=\"font-family:var(--font-display);font-size:24px;color:var(--sage-600);line-height:1;\">{{ m.year }}<\u002Fspan>\n                  <h3 style=\"margin:2px 0 0;font-family:var(--font-display);font-weight:400;font-size:21px;line-height:1.2;color:var(--sage-700);\">{{ m.title }}<\u002Fh3>\n                  <p style=\"margin:0;font-size:15px;line-height:1.65;color:var(--ink-700);\">{{ m.text }}<\u002Fp>\n                  <span style=\"display:inline-flex;align-items:center;gap:6px;font-family:var(--font-body);font-weight:600;font-size:13.5px;color:var(--sage-600);margin-top:4px;\">Læs mere <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14\"><\u002Fpath><path d=\"m13 6 6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex;justify-content:center;margin-top:40px;\">\n          <button type=\"button\" sc-camel-on-click=\"{{ goShop }}\" style=\"border:none;cursor:pointer;background:var(--sage-500);color:#fff;font-family:var(--font-body);font-weight:600;font-size:15px;padding:15px 30px;border-radius:999px;\" style-hover=\"background:var(--sage-600)\">Shop NatureCell →<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsection>\n      <section style=\"max-width:680px;margin:0 auto;padding:clamp(35px,6vw,64px) clamp(16px,4vw,24px);display:flex;flex-direction:column;gap:22px;\">\n        <h2 style=\"margin:0;font-family:var(--font-display);font-weight:400;font-size:clamp(20px,3.1vw,32px);color:var(--sage-700);\">Vi lover ikke mirakler<\u002Fh2>\n        <p style=\"margin:0;font-size:17px;line-height:1.8;color:var(--ink-700);\">I stedet lader vi vores kunder fortælle om deres egne oplevelser. Vores produkter er plantebaserede — CBD i samspil med glycerin, mandelolie, hampolie, squalane, aloe vera, sheasmør og agurkeekstrakt. Vegansk og uden syntetisk parfume.<\u002Fp>\n        <p style=\"margin:0;font-size:17px;line-height:1.8;color:var(--ink-700);\">Vores CBD-olie produceres på GMP- og ISO-certificerede faciliteter i Danmark. Det er sådan, vi bygger tryghed: dansk produktion, dansk test og fuld åbenhed.<\u002Fp>\n      <\u002Fsection>\n      <section style=\"max-width:1100px;margin:0 auto;padding:8px 24px 64px;\">\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:clamp(28px,5vw,44px);align-items:center;\">\n          <img src=\"2076c17b-0bfc-4479-ad54-d916fc610475\" alt=\"Møllerup Gods\" style=\"width:100%;height:430px;border-radius:18px;object-fit:cover;display:block;\">\n          <div style=\"display:flex;flex-direction:column;gap:14px;\">\n            <span style=\"font-family:var(--font-body);font-weight:600;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:var(--sage-600);\">Hvor det startede<\u002Fspan>\n            <h2 style=\"margin:0;font-family:var(--font-display);font-weight:400;font-size:clamp(20px,3.1vw,32px);color:var(--sage-700);\">Rødder på Møllerup Gods<\u002Fh2>\n            <p style=\"margin:0;font-size:16px;line-height:1.8;color:var(--ink-700);\">Vores rejse begyndte på Møllerup Gods i Djursland — med en idé om, at hudpleje kan være både plantebaseret, ærlig og dansk. Det var her, de første formuleringer tog form, og det er stadig den ånd, der driver os i dag.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n      <section style=\"background:var(--paper-2);border-top:1px solid var(--border-soft);border-bottom:1px solid var(--border-soft);\">\n        <div style=\"max-width:1000px;margin:0 auto;padding:clamp(31px,6vw,56px) clamp(16px,4vw,24px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(47%,200px),1fr));gap:32px;\">\n          <sc-for list=\"{{ aboutStats }}\" as=\"st\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex;flex-direction:column;gap:6px;text-align:center;\">\n              <span style=\"font-family:var(--font-display);font-size:clamp(27px,4.3vw,44px);color:var(--sage-700);line-height:1;\">{{ st.num }}<\u002Fspan>\n              <span style=\"font-size:14px;color:var(--ink-500);line-height:1.4;\">{{ st.label }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"background:var(--sage-50);border-top:1px solid var(--border-soft);\">\n        <div style=\"max-width:1100px;margin:0 auto;padding:clamp(35px,6vw,64px) clamp(16px,4vw,24px);display:grid;grid-template-columns:0.9fr 1.1fr;gap:clamp(22px,4vw,44px);align-items:center;\">\n          <img src=\"b5cb43b2-db0d-479f-9fff-62795378c99f\" alt=\"Familien bag NatureCell\" style=\"width:100%;height:440px;border-radius:18px;object-fit:cover;display:block;\">\n          <div style=\"display:flex;flex-direction:column;gap:16px;\">\n            <span style=\"font-family:var(--font-body);font-weight:600;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:var(--sage-600);\">Familien bag<\u002Fspan>\n            <h2 style=\"margin:0;font-family:var(--font-display);font-weight:400;font-size:clamp(21px,3.3vw,34px);line-height:1.1;color:var(--sage-700);\">Drevet af en dansk familie<\u002Fh2>\n            <p style=\"margin:0;font-size:16px;line-height:1.8;color:var(--ink-700);\">NatureCell er familiedrevet. Vi står selv bag hver beslutning — fra råvarer og formuleringer til den måde, vi taler med vores kunder på. Vi lover ikke mirakler; vi lover ærlighed, dansk produktion og produkter, vi selv bruger hver dag.<\u002Fp>\n            <p style=\"margin:0;font-family:var(--font-serif);font-style:italic;font-size:18px;color:var(--sage-700);\">“Vi bygger NatureCell på tillid — én ærlig kundeoplevelse ad gangen.”<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <!-- ============ B2B LOGIN ============ -->\n    <sc-if value=\"{{ isB2B }}\" hint-placeholder-val=\"{{ false }}\">\n      <section style=\"max-width:1100px;margin:0 auto;padding:clamp(38px,5vw,64px) clamp(16px,4vw,24px) clamp(54px,6vw,90px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:clamp(28px,5vw,56px);align-items:center;\">\n        <div style=\"display:flex;flex-direction:column;gap:20px;\">\n          <span style=\"font-family:var(--font-body);font-weight:600;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:var(--sage-600);\">For forhandlere &amp; klinikker<\u002Fspan>\n          <h1 style=\"margin:0;font-family:var(--font-display);font-weight:400;font-size:clamp(26px,4.1vw,42px);line-height:1.08;color:var(--sage-700);\">NatureCell B2B<\u002Fh1>\n          <p style=\"margin:0;font-size:17px;line-height:1.7;color:var(--ink-700);max-width:460px;\">Sælger du NatureCell i din butik eller klinik? Log ind for at se dine priser, styre dine rabatter og bestille til engros.<\u002Fp>\n          <div style=\"display:flex;flex-direction:column;gap:12px;margin-top:6px;\">\n            <sc-for list=\"{{ b2bPerks }}\" as=\"bp\" hint-placeholder-count=\"4\">\n              <div style=\"display:flex;gap:12px;align-items:flex-start;\"><span style=\"color:var(--sage-600);margin-top:2px;flex:none;\"><svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg><\u002Fspan><span style=\"font-size:15px;color:var(--ink-700);line-height:1.5;\">{{ bp }}<\u002Fspan><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"background:var(--sage-50);border:1px solid var(--border-sage);border-radius:var(--radius-lg);padding:20px;margin-top:8px;display:flex;flex-direction:column;gap:8px;\">\n            <span style=\"font-family:var(--font-display);font-size:17px;color:var(--sage-700);\">Konti oprettes og godkendes af NatureCell<\u002Fspan>\n            <p style=\"margin:0;font-size:14px;line-height:1.6;color:var(--ink-700);\">Af hensyn til regulering og rabatstyring opretter vi din B2B-konto manuelt. Anmod om adgang, så ve r en oplevelse, der fik adrenalinen til at pumpe. At stå foran nogle af landets skarpeste investorer og forsvare en helt ny kategori i dansk hudpleje krævede, at vi kunne dokumentere hvert eneste led — fra råvare til godkendelse.','Jesper Buch valgte at gå ind som investor. Det gav både kapital og erfaring til at nå bredere ud, og i årene efter kom NatureCell i flere butikker og hjem over hele landet.','Investeringen ændrede ikke på, hvordan vi arbejder. Vi er stadig en familiedrevet virksomhed med rødder på Møllerup Gods, og vi træffer stadig vores valg ud fra ærlighed frem for løfter.'],\n      facts: [{ k: 'Investor', v: 'Jesper Buch' }, { k: 'Program', v: 'Løvens Hule' }, { k: 'Effekt', v: 'Bredere distribution' }] },\n    '2019': { year: '2019', mgo: () => this.go('milestone', { id: '2019' }), title: 'Først godkendt i Danmark', eyebrow: 'Milepæl', img: 'https://naturecell.dk/cdn/shop/files/NatureCell_Sortiment_Hudpleje_0725.webp?v=1752671972',\n      lead: 'NatureCell bliver den første CBD-hudplejeserie godkendt til salg i Danmark.',\n      paras: ['Da vi startede, blev CBD i Danmark betragtet som et medicinsk stof, og ingrediensen var endnu ikke anerkendt til kosmetik. Derfor gik vi den lange vej: i dialog med både Miljøstyrelsen og medicinalbranchen dokumenterede vi råvarens oprindelse, renhed og sikkerhed.','I 2019 fik vi som de første tilladelse til at producere, sælge og markedsføre CBD-hudpleje i Danmark — og samme år kom serien i Matas. Det var startskuddet til en helt ny kategori på det danske marked.','To år senere, i 2021, blev cannabidiol optaget i EU’s kosmetikdatabase CosIng. I dag er CBD en anerkendt kosmetisk ingrediens i hele Europa.'],\n      facts: [{ k: 'Godkendt', v: 'Første i Danmark' }, { k: 'Lancering', v: 'Matas, 2019' }, { k: 'Sortiment', v: '7 produkter' }] },\n    '2018': { year: '2018', mgo: () => this.go('milestone', { id: '2018' }), title: 'Idéen fødes', eyebrow: 'Begyndelsen', img: 'assets/founders.jpg',\n      lead: 'På Møllerup },\n    ];\n    const areaLabels = Object.fromEntries(areas.map(a => [a.key, a.label]));\n    const needLabels = Object.fromEntries(needs.map(n => [n.key, n.label]));\n    const NA = 'https://naturecell.dk/cdn/shop/articles/';\n    const cases = [\n      { id: 'birgit', name: 'Birgit Kortbæk', area: 'haender', title: 'Håndcreme der ikke fedter', hasVideo: true, yt: 'dMDaX1Q3XS4', products: ['body-lotion','skin-oil'], img: NA + 'IMG_6576_c13f8f50-a5d4-49f6-acb7-cd2b966a735d_640x640_crop_center.jpg?v=1781707452',\n        quote: 'Endelig en håndcreme, der ikke fedter – så jeg kan male videre med det samme.',\n        paras: ['Da vi besøgte Birgit Kortbæk i hendes atelier, var hun i fuld gang med at male. Farverne fyldte lærredet, penslerne lå klar, og hænderne arbejdede koncentreret med de små detaljer.','Som kunstner bruger Birgit sine hænder hele dagen, og hun havde længe ledt efter en håndcreme, der plejede uden at efterlade en fedtet hinde. NatureCells håndpleje blev en fast del af hendes hverdag i atelieret.'],\n        author: 'Lizbeth Falk', videoId: 'dMDaX1Q3XS4', tags: ['Håndcreme','Tørre hænder'],\n        body: [\n          { t: 'p', x: 'Da vi besøgte Birgit Kortbæk i hendes atelier, var hun i fuld gang med at male. Farverne fyldte lærredet, penslerne lå klar, og hænderne arbejdede koncentreret med de små detaljer.' },\n          { t: 'q', x: 'Men inden hun gik i gang, gjorde hun noget, vi ikke havde forventet. Hun smurte håndcreme på.' },\n          { t: 'q', x: 'Jeg bruger faktisk håndcremen både før og efter jeg maler, fortæller Birgit.' },\n          { t: 'p', x: 'For Birgit er kunsten en stor passion i fritiden, og derfor bruger hun mange timer ved staffeliet. Samtidig betyder det også meget for hende, at hendes hænder ser pæne og velplejede ud i hverdagen og på arbejdet. Derfor passer hun generelt godt på sine hænder.' },\n          { t: 'h', x: 'Derfor bruger Birgit håndcreme før hun maler' },\n          { t: 'p', x: 'Noget af det, Birgit sætter størst pris på ved NatureCell Håndcreme, er, at den trænger hurtigt ind og ikke fedter.' },\n          { t: 'p', x: 'Men der er også en anden grund til, at hun bruger den, inden hun går i gang med at male.' },\n          { t: 'q', x: 'Jeg oplever, at malingen ikke sætter sig så meget fast på hænderne, når jeg har smurt håndcreme på først. Ofte kan jeg næsten nuldre malingen af bagefter uden at skulle skrubbe hænderne så meget.' },\n          { t: 'p', x: 'For Birgit betyder det, at hun ikke behøver at vaske eller rense hænderne lige så hårdt efter arbejdet ved staffeliet.' },\n          { t: 'p', x: 'Samtidig sætter hun pris på, at håndcremen hurtigt absorberes af huden, så hun kan fortsætte sit arbejde uden at føle sig fedtet på hænderne.' },\n          { t: 'h', x: 'Pleje både under og efter arbejdet' },\n          { t: 'p', x: 'For Birgit er håndcremen ikke kun noget, hun bruger før hun maler. Den er også blevet en fast del af rutinen bagefter.' },\n          { t: 'p', x: 'Efter en dag med maling, håndvask og rengøring bruger hun håndcremen igen som en del af sin daglige håndpleje.' },\n          { t: 'p', x: 'NatureCell Håndcreme er udviklet med fokus på både komfort, fugt og daglig pleje af hænderne.' },\n          { t: 'p', x: 'CBD indgår som en aktiv ingrediens i formuleringen og arbejder sammen med blandt andet aloe vera, glycerin, sheasmør og planteolier, som er kendt for deres fugtgivende og plejende egenskaber. Kombinationen er udviklet med henblik på at give huden komfort og pleje – også ved hyppig brug.' },\n          { t: 'p', x: 'Håndcremen indeholder desuden E-vitamin, panthenol og niacinamid, som er velkendte ingredienser i moderne hudpleje og bidrager til et velplejet udseende af huden.' },\n          { t: 'p', x: 'For at gøre formuleringen ekstra nærende er den beriget med planteolier fra blandt andet solsikke, saflor, kokos og hyben. Sammen med sheasmør giver de håndcremen dens rige karakter, samtidig med at den absorberes hurtigt og ikke efterlader hænderne fedtede.' },\n          { t: 'q', x: 'Det er netop balancen mellem de mange plejende ingredienser og den hurtige indtrængning, som Birgit fremhæver som en af grundene til, at håndcremen er blevet en fast del af hendes hverdag.' },\n          { t: 'h', x: 'Ikke kun kunstnere vælger denne håndcreme' },\n          { t: 'p', x: 'Selvom Birgit bruger håndcremen i sit atelier, er hun langt fra den eneste.' },\n          { t: 'p', x: 'Vi møder kunder fra mange forskellige erhverv og brancher, som fortæller, at de sætter pris på en håndcreme, der trænger hurtigt ind og ikke efterlader huden fedtet.' },\n          { t: 'p', x: 'Det gælder blandt andet mennesker, der arbejder med mad, kokke, tandlæger og andre faggrupper, som vasker eller afspritter hænder mange gange i løbet af dagen.' },\n          { t: 'p', x: 'Vi har også kunder, som bruger håndcremen på kroppen efter bad, fordi den er nem at fordele og hurtigt absorberes af huden.' },\n          { t: 'p', x: 'Fælles for mange af dem er ønsket om en creme, der passer ind i en travl hverdag, hvor man hurtigt skal videre til næste opgave.' },\n          { t: 'h', x: 'Den passer bare ind i min hverdag' },\n          { t: 'p', x: 'Når vi spørger Birgit, hvorfor hun bliver ved med at bruge håndcremen, er svaret enkelt:' },\n          { t: 'q', x: 'Den passer bare ind i min hverdag – og giver mig bløde og velplejede hænder, og så er den dansk produceret.' },\n          { t: 'p', x: 'Nogle gange er det netop de små detaljer, der gør den største forskel.' },\n        ] },\n      { id: 'annette', name: 'Annette Mortensen', area: 'ansigt', title: 'Fra ubehag til en mere balanceret hud', hasVideo: true, yt: '8h-TJ92uN8Q', products: ['cleansing-gel','serum','day-cream'], img: NA + 'Annette_Mortensen_kundecase_naturecell_IMG_4227_26e480dc-7732-471e-83e7-a761063b6a1d_640x640_crop_center.jpg?v=1777113771',\n        quote: 'Min hud føles mere fri og rolig, end den har gjort i lang tid.',\n        paras: ['En ærlig kundeudtalelse – med Annettes egne ord: \"I lang tid har jeg haft svært ved at finde hudpleje, som jeg faktisk kunne tåle.\"','Annette arbejder som sygeplejerske og har en sart hud, der nemt reagerer. Efter at have skiftet til en enkel rutine med NatureCell beskriver hun selv huden som mere fri og balanceret i hverdagen.'],\n        author: 'Lizbeth Falk', videoId: '8h-TJ92uN8Q', tags: ['Sensitiv hud','Ansigt','CBD'],\n        body: [\n          { t: 'h', x: 'En ærlig kundeudtalelse – med Annettes egne ord' },\n          { t: 'q', x: 'I lang tid har jeg haft svært ved at finde hudpleje, som jeg faktisk kunne tåle.' },\n          { t: 'q', x: 'Min hud føles mere fri og balanceret, og jeg oplever ikke længere det samme ubehag.' },\n          { t: 'h', x: 'Se Annettes video' },\n          { t: 'p', x: 'I videoen viser Annette også, hvordan hun bruger kompletpakken og CBD olien 15% som del af sin daglige rutine.' },\n          { t: 'h', x: 'Kundens egen fortælling' },\n          { t: 'q', x: 'Jeg hedder Annette og arbejder til dagligt som sygeplejerske. I lang tid har jeg haft svært ved at finde hudpleje, som jeg faktisk kunne tåle. Jeg oplevede ofte, at min hud føltes lukket, og det gav mig ubehag – endda ondt i halsen. Efter at have brugt NatureCells kompletpleje dagligt gennem en længere periode, har jeg endelig fundet noget, der fungerer for mig. Min hud føles mere fri og balanceret, og jeg oplever ikke længere det samme ubehag. Jeg må bare sige: Jeg er fan. Og jeg kan varmt anbefale NatureCells produkter. – Annette Mortensen' },\n          { t: 'h', x: 'Vigtigt at vide' },\n          { t: 'p', x: 'Dette er Annettes personlige oplevelse. Hud er forskellig, og resultater kan variere. Oplevelser med hudplejeprodukter er individuelle. NatureCell olier og cremer er kosmetiske produkter, udviklet til pleje af huden i hverdagen. Videoen og teksten bygger udelukkende på Annettes personlige erfaring og deles med hendes samtykke.' },\n        ] },\n      { id: 'christian', name: 'Christian Laursen', age: 44, area: 'ansigt', title: 'Hudpleje til mænd – med fokus på tør hud', hasVideo: true, yt: 'RHGezLkTcO8', products: ['day-cream','night-cream'], img: NA + 'Christian_Laursen_B_IG_b89dca71-db63-42f5-baec-7ecd76535e56_640x640_crop_center.jpg?v=1773765895',\n        quote: 'Jeg kæmpede med tør hud før – det gør jeg ikke på samme måde i dag.',\n        paras: ['I denne kundecase deler Christian sin personlige oplevelse med hudpleje. Christian fortæller, at han tidligere oplevede tør hud.','I dag har han fået en fast rutine med dag- og natcreme, og han fremhæver, hvor enkelt det er at holde fast i den om morgenen og aftenen.'],\n        author: 'Lizbeth Falk', videoId: 'RHGezLkTcO8', tags: ['Ansigt','CBD','Tørt ansigt'],\n        body: [\n          { t: 'p', x: 'I denne kundecase deler Christian sin personlige oplevelse med hudpleje.' },\n          { t: 'p', x: 'Christian fortæller, at han tidligere oplevede tør hud, og at han i dag har fået en fast rutine med dag- og natcreme. Han blev introduceret til produkterne gennem sit naboskab med Lizbeth og Allan fra NatureCell.' },\n          { t: 'p', x: 'I videoen fortæller han med egne ord om sin oplevelse af at pleje huden dagligt, og hvordan en fast rutine er blevet en del af hans hverdag.' },\n          { t: 'p', x: 'Kundecasen er et eksempel på en individuel oplevelse med hudpleje. Hud er forskellig fra person til person, og oplevelser og resultater kan variere.' },\n          { t: 'h', x: 'Citat fra Christians video' },\n          { t: 'q', x: 'Jeg kæmpede med tør hud før – det gør jeg ikke på samme måde i dag.' },\n          { t: 'p', x: 'Her kan du høre hans egne ord om CBD hudpleje.' },\n          { t: 'p', x: 'Denne kundecase bygger på en individuel kundes personlige oplevelse. Oplevelser kan variere fra person til person. Vores produkter er kosmetik og ikke medicin, og er ikke beregnet til at diagnosticere, behandle eller forebygge sygdom.' },\n        ] },\n      { id: 'annette-pigment', name: 'An
